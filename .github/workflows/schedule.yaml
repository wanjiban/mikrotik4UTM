name: Scheduled Maintenance

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨执行
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual action'
        required: false
        default: 'all'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup failed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100
            });
            
            for (const run of runs.data.workflow_runs) {
              if (run.status === 'completed' && run.conclusion === 'failure') {
                console.log(`Deleting failed run: ${run.id}`);
                await github.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              }
            }
            console.log('Cleanup completed');
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check upstream version
        id: check
        run: |
          # 获取本地记录的版本
          LOCAL_VERSION=$(cat .upstream_version 2>/dev/null || echo "")
          
          # 从mikrotik.ltd获取最新stable版本
          REMOTE_VERSION=$(curl -s https://upgrade.mikrotik.ltd/routeros/NEWESTa7.stable | cut -d' ' -f1)
          
          echo "Local version: $LOCAL_VERSION"
          echo "Remote version: $REMOTE_VERSION"
          
          if [ "$LOCAL_VERSION" != "$REMOTE_VERSION" ] && [ -n "$REMOTE_VERSION" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "$REMOTE_VERSION" > .upstream_version
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit updated version
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .upstream_version
          git commit -m "chore: update upstream version to $(cat .upstream_version)"
          git push
      
      - name: Trigger patched workflow
        if: steps.check.outputs.updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'chr-patched.yaml',
              ref: context.ref,
              inputs: {
                version: 'stable',
                pklversion: '0.30.2',
                makefileflags: '-d',
                tagprefix: 'chr-patched-',
                releaseprefix: 'CHR-PATCHED'
              }
            })
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    runs-on: ubuntu-latest
    needs: [cleanup, check-upstream]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Cleanup: ${{ needs.cleanup.result }}"
          echo "Check upstream: ${{ needs.check-upstream.result }}"
          if [ "${{ needs.check-upstream.outputs.updated }}" == "true" ]; then
            echo "Triggered patched workflow for new version"
          fi
