name: CHR Patched Packages
permissions: write-all

on:
  workflow_dispatch:
    inputs:
      version:
        default: "stable"
        type: string
        description: 'RouterOS 版本或通道 (例如: stable, testing, 7.20.8)'
        required: true
      pklversion:
        default: "0.30.2"
        type: string
        description: 'pkl 版本'
        required: true
      makefileflags:
        default: "-d"
        type: string
        description: 'Makefile 选项'
        required: true
      tagprefix:
        default: "chr-patched-"
        type: string
        description: 'git tag 前缀'
        required: true
      releaseprefix:
        default: "CHR-PATCHED"
        type: string
        description: 'Release 名称前缀'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.outputdirs.outputs.built }}
      chr-version: ${{ steps.get-routeros-version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install packages into building machine
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip qemu-utils rsync gdisk dosfstools parted genisoimage zip make wget
      - name: Install Apple pkl-lang
        run: |
          curl -L -o pkl 'https://github.com/apple/pkl/releases/download/${{ github.event.inputs.pklversion }}/pkl-linux-amd64'
          chmod +x pkl
          ./pkl --version
          cp ./pkl /usr/local/bin
      - name: Set RouterOS Patched version
        id: get-routeros-version
        run: |
          VERSION=$(CHR_VERSION="${{ github.event.inputs.version }}" pkl eval ./Pkl/patched-version.pkl)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Fetch changelog
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ "$VERSION" == "stable" ]; then
            REMOTE_VERSION=$(curl -s https://upgrade.mikrotik.ltd/routeros/NEWESTa7.stable | cut -d' ' -f1)
          elif [ "$VERSION" == "testing" ]; then
            REMOTE_VERSION=$(curl -s https://upgrade.mikrotik.ltd/routeros/NEWESTa7.testing | cut -d' ' -f1)
          else
            REMOTE_VERSION="$VERSION"
          fi
          CHANGELOG=$(curl -s "https://upgrade.mikrotik.ltd/routeros/${REMOTE_VERSION}/CHANGELOG" 2>/dev/null | head -50 | sed 's/"/\\"/g' | tr '\n' ' ')
          echo "content=$CHANGELOG" >> $GITHUB_OUTPUT
      - name: Build using Makefile
        id: make
        run: |
          make ${{ github.event.inputs.makefileflags }} CHR_VERSION=${{ steps.get-routeros-version.outputs.version }} PKL_PATCHED=true
      - name: Store /Machines directory .utm machines built
        id: outputdirs
        run: |
          echo built=$(ls Machines | jq -R -s -c 'split("\n")[:-1]') >> $GITHUB_OUTPUT
      - name: Produce Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Machines-Patched
          path: ./Machines
      - name: Push git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          TAG="${{ github.event.inputs.tagprefix }}${{ steps.get-routeros-version.outputs.version }}"
          git tag "$TAG"
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git push origin "$TAG"
  release:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create GitHub release
        id: create
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tagprefix }}${{ needs.build.outputs.chr-version }}
          release_name: ${{ github.event.inputs.releaseprefix }} ${{ needs.build.outputs.chr-version }}
          body: |
            UTM 虚拟机包 - RouterOS CHR (已修补) ${{ needs.build.outputs.chr-version }}
            来源: https://mikrotik.ltd/

            ### 虚拟机列表
          draft: false
          prerelease: true
  fossilize:
    runs-on: ubuntu-latest
    needs:
      - release
      - build
    strategy:
      matrix:
        machine: ${{ fromJSON(needs.build.outputs.machines) }}
      fail-fast: true
      max-parallel: 1
    steps:
      - name: Get all machines
        uses: actions/download-artifact@v4
        with:
          name: Machines-Patched
      - name: Create ZIP for ${{ matrix.machine}}
        id: rename
        run: |
          zip -r ${{ matrix.machine}}.zip ${{ matrix.machine}}
      - name: Upload Pkl'd image ${{ matrix.machine }} as release asset
        id: upload-release-asset-raw
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./${{ matrix.machine }}.zip
          asset_name: ${{ matrix.machine }}.zip
          asset_content_type: application/octet-stream
      - name: Edit Release
        uses: irongut/EditRelease@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          id:  ${{ needs.release.outputs.id }}
          body: |

            #### ${{ matrix.machine }}
            https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tagprefix }}${{ needs.build.outputs.chr-version }}/${{ matrix.machine }}.zip
            ```
            utm://downloadVM?url=https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tagprefix }}${{ needs.build.outputs.chr-version }}/${{ matrix.machine }}.zip
            ```
  finish:
    runs-on: ubuntu-latest
    needs:
      - release
      - build
      - fossilize
    steps:
      - name: Edit Release with full content
        uses: irongut/EditRelease@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          id:  ${{ needs.release.outputs.id }}
          body: |

            ### 使用说明

            ### 安装方式

            #### 使用 `utm://` 在终端中打开
            在 macOS 上安装 [UTM](https://mac.getutm.app)：
            1. 打开「终端」
            2. 输入 `open '<utm_app_url>'`，将 `utm_app_url` 替换为上面的 `utm://...` 链接 - **注意用单引号包裹 URL**
            3. UTM 会打开并提示是否下载虚拟机
            4. 确认后，虚拟机将保存在 UTM 的默认文档目录
            5. 启动虚拟机，会弹出一个窗口显示虚拟机终端

            #### 直接下载 ZIP 文件
            下载链接中的 ZIP 文件包含 UTM 虚拟机包。解压后，在已安装 [UTM](https://mac.getutm.app) 的情况下，`.utm` 文件夹会直接用 UTM 打开。

            ### 关于已修补镜像

            本镜像由 [mikrotik.ltd](https://mikrotik.ltd/) 提供，包含以下特性：
            - 已修补公钥，支持完整功能
            - 支持在线更新
            - 支持在线授权
            - 支持云备份
            - 支持 DDNS

            ### 更新日志

            <a href="https://upgrade.mikrotik.ltd/routeros/${{ needs.build.outputs.chr-version }}/CHANGELOG" target="_blank">查看更新日志</a>
